name: Game Platform Quality
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
  schema-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Fetch pinned disposable database image
        run: docker pull pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1; immutable reviewed action
        with:
          version: 2.121.0
      - name: Verify actual CLI fresh commissioning and full restore
        run: npm run test:fresh-install
      - name: Verify schema, isolation and restore without production credentials
        run: npm run test:schema-recovery
  production-smoke:
    if: github.event_name != 'pull_request'
    needs: [policy-contract, schema-recovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Wait for Vercel Git deployment
        if: github.event_name == 'push'
        run: sleep 45
      - name: Verify production
        env:
          GAME_PLATFORM_URL: https://game-platform-wine-nine.vercel.app
          EXPECTED_REVISION: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run smoke:production; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          exit 1
