name: Game Platform Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
